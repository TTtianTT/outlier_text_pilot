[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-text-pilot"
version = "0.1.0"
description = "Controlled pilot experiments for semantic-behavioral text coding"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "cryptography>=41"]

[project.optional-dependencies]
hf = ["torch>=2.2,<3", "transformers>=4.46,<5", "sentencepiece>=0.2", "protobuf>=4", "wordfreq>=3.1,<4", "safetensors>=0.4"]
plot = ["matplotlib>=3.7"]

[project.scripts]
otc = "otc.cli:main"

[tool.setuptools.packages.find]
include = ["otc*"]
